<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="vendor/codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="vendor/codemirror/theme/material-darker.css">
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <div class="container">
        <div class="editors">
            <div class="editor-container">
                <div class="editor-header">HTML <small>Emmet: Tab para expandir · Esc para salir</small></div>
                <textarea class="editor" id="html-editor" spellcheck="false"></textarea>
            </div>
            <div class="editor-container">
                <div class="editor-header">CSS <small>Emmet: Tab para expandir · Esc para salir</small></div>
                <textarea class="editor" id="css-editor" spellcheck="false"></textarea>
            </div>
            <div class="editor-container">
                <div class="editor-header">JavaScript</div>
                <textarea class="editor" id="js-editor" spellcheck="false"></textarea>
            </div>
        </div>
        <section class="output" aria-label="Resultado">
            <div class="preview">
                <div class="toolbar"><span>Vista previa</span><button id="run" type="button">Ejecutar</button></div>
                <iframe id="preview-frame" title="Vista previa del código" sandbox="allow-scripts allow-modals"></iframe>
            </div>
            <section class="console" aria-label="Consola">
                <div class="toolbar"><span>Consola</span><button id="clear-console" type="button">Limpiar</button></div>
                <div id="console-output" role="log" aria-live="polite" aria-label="Mensajes de consola"></div>
                <p class="console-help">Mensajes y errores del código. Se limpia al ejecutar.</p>
            </section>
        </section>
    </div>
    <script src="vendor/codemirror/lib/codemirror.js"></script>
    <script src="vendor/codemirror/mode/xml/xml.js"></script>
    <script src="vendor/codemirror/mode/javascript/javascript.js"></script>
    <script src="vendor/codemirror/mode/css/css.js"></script>
    <script src="vendor/codemirror/mode/htmlmixed/htmlmixed.js"></script>
    <script src="vendor/emmet/browser.js"></script>
    <script src="editor.js"></script>
</body>
</html>
